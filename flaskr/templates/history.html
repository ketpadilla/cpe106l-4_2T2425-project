{% extends "layout.html" %}

{% block title %}
  {% if title %}
    {{ title }}
  {% endif %}
{% endblock %}

{% block content %}

<div class="container py-5">
  <div class="row justify-content-center text-center mb-4">
    <div class="col">
      <h2 class="mb-1" style="color: var(--text);">Calorie Intake History</h2>
      <p class="text-muted">Track your daily calorie consumption.</p>
    </div>
  </div>

  <div class="row justify-content-center mt-4">
    <div class="col-12 d-flex justify-content-center">
      <div class="card px-4 py-3" style="background: var(--dark); border: none; max-width: 600px;">
        <h5 id="monthYear" class="text-center mb-3" style="color: var(--text-muted);"></h5>
        <div style="position: relative; height: 300px;">
          <canvas id="calorieChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="row justify-content-center mt-4">
    <div class="col-md-8">
      <table id="historyTable" class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Total Calories</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel">
  <div class="modal-dialog">
    <div class="modal-content" style="background: var(--background); color: var(--text); border: none;">
      <div class="modal-header" style="border-bottom: 1px solid var(--secondary);">
        <h5 class="modal-title" id="detailsModalLabel">Calorie Details</h5>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Close">Close</button>
      </div>
      <div class="modal-body">
        <h6 id="modalDate" style="color: var(--text-muted);"></h6>
        <table class="table">
          <thead>
            <tr>
              <th>Food Item</th>
              <th>Servings</th>
              <th>Base Calorie</th>
              <th>Total Calories</th>
            </tr>
          </thead>
          <tbody id="modalDetails"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>

{% endblock %}
