{% extends "layout.html" %}

{% block title %}
  {% if title %}
  {{ title }}
  {% endif %}
{% endblock %}

{% block content %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

<!-- TODO: DAILY CALORIE INTAKE -->
<div class="container py-5">
  <div class="row justify-content-center text-center g-2">
    <div class="col">
      <h2 class="mb-1">Track Your Calories</h2>
      <p class="text-muted">Easily find calorie details for your meals and snacks.</p>
    </div>
  </div>

  <div class="row justify-content-center text-center g-2 px-0">
    <div class="col-12 d-flex justify-content-center">
      <div class="card shadow-lg px-4 py-4 mx-auto" style="max-width: 80%;"> 
        <div class="d-flex justify-content-center align-items-center flex-wrap">
          <div class="col-md-6 text-center">
            <canvas id="consumedChart" style="width:100%; height:auto;"></canvas>
            <h5 class="pt-3">Consumed</h5>
          </div>
          <div class="col-md-6 text-center">
            <canvas id="remainingChart" style="width:100%; height:auto;"></canvas>
            <h5 class="pt-3">Remaining</h5>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="container pb-5">
  <div class="row justify-content-center mt-4">
    <div class="col-12 d-flex justify-content-center">
      <div>
        <h3 class="text-center">Today's Food Entries</h3>
        <hr>

        <div id="food-list-today">
          <!-- Food list will be dynamically inserted here -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Link to external JavaScript -->
<script src="{{ url_for('static', filename='js/intake-daily.js') }}"></script>

{% endblock %}
